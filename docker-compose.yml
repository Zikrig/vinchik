services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vinchik
      POSTGRES_PASSWORD: vinchik
      POSTGRES_DB: vinchik
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # test: ["CMD-SHELL", "pg_isready -U vinchik -d vinchik"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    env_file: .env
    command: ["python", "bot.py"]
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    command: ["python", "web.py"]
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
