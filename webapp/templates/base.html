<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vinchik Admin{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f6f4;
      --bg-accent: #e7efe9;
      --surface: #ffffff;
      --ink: #1a2420;
      --muted: #5c6b64;
      --line: #d5e0da;
      --brand: #1f6b4f;
      --brand-hover: #18553f;
      --danger: #b42318;
      --ok: #067647;
      --warn: #92400e;
      --male: #2563eb;
      --male-soft: #dbeafe;
      --female: #db2777;
      --female-soft: #fce7f3;
      --premium: #a16207;
      --premium-soft: #fef3c7;
      --shadow: 0 10px 30px rgba(26, 36, 32, 0.06);
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 10% -10%, #d9ebe2 0%, transparent 55%),
        radial-gradient(700px 380px at 100% 0%, #e8f0ea 0%, transparent 50%),
        var(--bg);
    }
    h1, h2, h3 {
      font-family: Manrope, system-ui, sans-serif;
      letter-spacing: -0.02em;
      margin: 0 0 .5rem;
    }
    a { color: var(--brand); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code {
      font-size: .9em;
      background: var(--bg-accent);
      padding: .1rem .35rem;
      border-radius: 6px;
    }
    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .brand {
      font-family: Manrope, sans-serif;
      font-weight: 700;
      font-size: 1.35rem;
    }
    .brand span { color: var(--brand); }
    .nav { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }
    .btn.secondary {
      background: var(--bg-accent);
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .btn.secondary:hover { text-decoration: none; background: #dce8e1; }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.15rem 1.25rem;
      margin-bottom: 1rem;
    }
    .panel h2 {
      font-size: 1.05rem;
      margin-bottom: .35rem;
    }
    .panel > p, .hint {
      color: var(--muted);
      font-size: .95rem;
      margin: 0 0 1rem;
      line-height: 1.45;
    }
    .row {
      display: flex;
      gap: .75rem;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: .35rem;
      font-size: .85rem;
      color: var(--muted);
      font-weight: 500;
    }
    input[type="text"],
    input[type="password"],
    input[type="number"],
    select {
      min-width: 140px;
      padding: .55rem .7rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }
    input:focus, select:focus {
      outline: 2px solid rgba(31, 107, 79, .25);
      border-color: var(--brand);
    }
    button, .btn {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: .6rem 1rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      background: var(--brand);
      color: #fff;
    }
    button:hover { background: var(--brand-hover); }
    button.secondary {
      background: var(--bg-accent);
      color: var(--ink);
      border: 1px solid var(--line);
    }
    button.danger { background: var(--danger); }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .95rem;
    }
    th, td {
      text-align: left;
      padding: .65rem .4rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
    .flash-ok { color: var(--ok); font-weight: 600; }
    .flash-err, .err { color: var(--danger); font-weight: 600; }
    .check {
      flex-direction: row;
      align-items: center;
      gap: .45rem;
      margin-bottom: .4rem;
    }
    .blocked-card {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 1rem 0;
      border-top: 1px solid var(--line);
    }
    .blocked-card:first-of-type { border-top: 0; }
    .blocked-card img, .ph {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 12px;
      background: var(--bg-accent);
    }
    .ph {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: .85rem;
    }
    .login-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
    }
    .login-card {
      width: min(400px, 100%);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 1.5rem;
    }
    .login-card h1 { margin-bottom: .25rem; }
    .login-card .hint { margin-bottom: 1.25rem; }
    .login-card input, .login-card button { width: 100%; }
    .login-card label { margin-bottom: .75rem; }
    .meta { font-size: .85rem; color: var(--muted); font-weight: 500; }
    h3 { font-size: .95rem; margin: 1rem 0 .6rem; color: var(--muted); }
    .jump {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem .85rem;
      margin: 0 0 1rem;
      font-size: .9rem;
    }
    .jump a { color: var(--muted); }
    .switch-list { display: flex; flex-direction: column; gap: .65rem; }
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      padding: .75rem 1rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--bg-accent);
    }
    .switch-row .label { font-weight: 600; color: var(--ink); }
    .switch-row .hint { font-size: .85rem; color: var(--muted); margin: .2rem 0 0; }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      font-size: .85rem;
      font-weight: 700;
      padding: .35rem .7rem;
      border-radius: 999px;
      border: 0;
      cursor: pointer;
      font: inherit;
    }
    .status-pill .dot {
      width: .65rem;
      height: .65rem;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-pill.on {
      background: #e3f6ec;
      color: var(--ok);
    }
    .status-pill.on .dot { background: var(--ok); }
    .status-pill.off {
      background: #fee4e2;
      color: var(--danger);
    }
    .status-pill.off .dot { background: var(--danger); }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      font-size: .8rem;
      font-weight: 700;
      padding: .2rem .55rem;
      border-radius: 999px;
    }
    .status-badge.on { background: #e3f6ec; color: var(--ok); }
    .status-badge.off { background: #fee4e2; color: var(--danger); }
    .status-badge .dot {
      width: .55rem;
      height: .55rem;
      border-radius: 50%;
    }
    .status-badge.on .dot { background: var(--ok); }
    .status-badge.off .dot { background: var(--danger); }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: .25rem;
      font-size: .75rem;
      font-weight: 600;
      padding: .18rem .5rem;
      border-radius: 999px;
      background: var(--bg-accent);
      color: var(--muted);
      margin-right: .25rem;
      white-space: nowrap;
    }
    .tag.ok { background: #e3f6ec; color: var(--ok); }
    .tag.warn { background: #fef3c7; color: var(--warn); }
    .tag.danger { background: #fee4e2; color: var(--danger); }
    .tag.male { background: var(--male-soft); color: var(--male); }
    .tag.female { background: var(--female-soft); color: var(--female); }
    .tag.premium { background: var(--premium-soft); color: var(--premium); }
    .tag.info { background: #e0f2fe; color: #0369a1; }
    .seg {
      display: inline-flex;
      align-items: stretch;
      flex-wrap: wrap;
      gap: 3px;
      padding: 3px;
      border-radius: 999px;
      background: #e8eef2;
      border: 1px solid var(--line);
      width: fit-content;
    }
    .seg input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      width: 0;
      height: 0;
    }
    .seg label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .3rem;
      margin: 0;
      padding: .4rem .75rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: .85rem;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      border: 0;
      flex-direction: row;
      min-width: auto;
      transition: background .15s ease, color .15s ease, box-shadow .15s ease;
      user-select: none;
    }
    .seg label:hover { color: var(--ink); background: rgba(255,255,255,.55); }
    .seg-empty {
      display: inline-flex;
      align-items: center;
      padding: .4rem .65rem;
      font-size: .8rem;
      font-weight: 600;
      color: var(--muted);
      opacity: .85;
      pointer-events: none;
      user-select: none;
    }
    .seg:has(input:checked) .seg-empty { display: none; }
    .seg input:focus-visible + label {
      outline: 2px solid rgba(31, 107, 79, .35);
      outline-offset: 1px;
    }
    .seg input:checked + label {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 1px 4px rgba(26, 36, 32, .12);
    }
    .seg.gender-switch {
      background: linear-gradient(90deg, var(--male-soft), #f3f4f6 45%, var(--female-soft));
    }
    .seg.gender-switch input[value="male"]:checked + label {
      background: var(--male);
      color: #fff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, .35);
    }
    .seg.gender-switch input[value="female"]:checked + label {
      background: var(--female);
      color: #fff;
      box-shadow: 0 2px 8px rgba(219, 39, 119, .35);
    }
    .seg.looking-switch input[value="male"]:checked + label {
      background: var(--male);
      color: #fff;
    }
    .seg.looking-switch input[value="female"]:checked + label {
      background: var(--female);
      color: #fff;
    }
    .seg.looking-switch input[value="any"]:checked + label {
      background: #7c3aed;
      color: #fff;
    }
    .seg.lang-switch input[value="ru"]:checked + label {
      background: #1d4ed8;
      color: #fff;
    }
    .seg.lang-switch input[value="tg"]:checked + label {
      background: #0f766e;
      color: #fff;
    }
    .toggle {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      gap: .55rem;
      margin: 0 .75rem .55rem 0;
      cursor: pointer;
      font-size: .9rem;
      font-weight: 500;
      color: var(--ink);
      user-select: none;
    }
    .toggle input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }
    .toggle-ui {
      position: relative;
      width: 2.5rem;
      height: 1.4rem;
      border-radius: 999px;
      background: #d1d5db;
      border: 1px solid #c4c9d0;
      transition: background .15s ease, border-color .15s ease;
      flex-shrink: 0;
    }
    .toggle-ui::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 1rem;
      height: 1rem;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
      transition: transform .15s ease;
    }
    .toggle input:checked + .toggle-ui {
      background: var(--ok);
      border-color: #059669;
    }
    .toggle input:checked + .toggle-ui::after {
      transform: translateX(1.05rem);
    }
    .toggle input:focus-visible + .toggle-ui {
      outline: 2px solid rgba(31, 107, 79, .35);
      outline-offset: 2px;
    }
    .toggle.danger input:checked + .toggle-ui {
      background: var(--danger);
      border-color: #912018;
    }
    .toggle.warn input:checked + .toggle-ui {
      background: #d97706;
      border-color: #b45309;
    }
    .toggle.male-blue input:checked + .toggle-ui {
      background: var(--male);
      border-color: #1d4ed8;
    }
    .panel-title {
      display: flex;
      align-items: center;
      gap: .45rem;
    }
    .toast-host {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      max-width: min(360px, calc(100vw - 2rem));
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      padding: .7rem .9rem;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      box-shadow: var(--shadow);
      font-size: .9rem;
      font-weight: 600;
      color: var(--ink);
      animation: toast-in .18s ease-out;
    }
    .toast.ok { border-color: #b7e4c7; color: var(--ok); }
    .toast.err { border-color: #f3c4bf; color: var(--danger); }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    button:disabled, .status-pill:disabled { opacity: .6; cursor: wait; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  <div class="toast-host" id="toast-host" aria-live="polite"></div>
  <script>
  (function () {
    const host = document.getElementById("toast-host");

    window.showToast = function (message, ok) {
      if (!message) return;
      const el = document.createElement("div");
      el.className = "toast " + (ok === false ? "err" : "ok");
      el.textContent = message;
      host.appendChild(el);
      setTimeout(function () {
        el.remove();
      }, 3200);
    };

    window.setPill = function (btn, on, onLabel, offLabel) {
      if (!btn) return;
      btn.classList.toggle("on", !!on);
      btn.classList.toggle("off", !on);
      const label = on ? (onLabel || "ON") : (offLabel || "OFF");
      const dot = btn.querySelector(".dot");
      btn.textContent = "";
      if (dot) btn.appendChild(dot);
      else {
        const d = document.createElement("span");
        d.className = "dot";
        btn.appendChild(d);
      }
      btn.appendChild(document.createTextNode(" " + label));
    };

    window.ajaxSubmit = async function (form) {
      const actionAttr = form.getAttribute("action");
      const methodAttr = (form.getAttribute("method") || "POST").toUpperCase();
      // name="action" / name="method" shadow form.action / form.method in the DOM
      const url = new URL(actionAttr || window.location.href, window.location.href).href;
      const res = await fetch(url, {
        method: methodAttr,
        body: new FormData(form),
        headers: {
          Accept: "application/json",
          "X-Requested-With": "XMLHttpRequest",
        },
        credentials: "same-origin",
      });
      let data = {};
      try {
        data = await res.json();
      } catch (_) {
        data = { ok: false, error: "Некорректный ответ сервера" };
      }
      if (res.status === 401) {
        window.location.href = new URL("login", window.location.href).href;
        throw new Error("auth");
      }
      if (res.status === 405) {
        throw new Error("Метод не разрешён (проверьте URL формы)");
      }
      if (!res.ok || data.ok === false) {
        throw new Error(data.error || data.detail || "Ошибка");
      }
      return data;
    };

    function updateTestCount(count) {
      document.querySelectorAll("[data-test-count]").forEach(function (el) {
        el.textContent = String(count);
      });
    }

    function channelUrls(channelId) {
      const sample = document.querySelector('form[data-ajax="channel-toggle"]');
      if (sample && sample.action) {
        const base = sample.action.replace(/\/\d+\/toggle\/?$/, "");
        return {
          toggle: base + "/" + channelId + "/toggle",
          del: base + "/" + channelId + "/delete",
        };
      }
      const add = document.querySelector('form[data-ajax="channel-add"]');
      const root = add ? add.action.replace(/\/channels\/add\/?$/, "") : "";
      return {
        toggle: root + "/channels/" + channelId + "/toggle",
        del: root + "/channels/" + channelId + "/delete",
      };
    }

    function channelRowHtml(ch) {
      const urls = channelUrls(ch.id);
      const on = !!ch.is_active;
      return (
        '<tr data-channel-id="' + ch.id + '">' +
        "<td>" + escapeHtml(ch.channel_id || "") + "</td>" +
        "<td>" + escapeHtml(ch.title || "") + "</td>" +
        "<td>" + escapeHtml(ch.invite_link || "") + "</td>" +
        '<td><span class="status-badge ' + (on ? "on" : "off") + '"><span class="dot"></span> ' +
        (on ? "ON" : "OFF") + "</span></td>" +
        '<td class="row">' +
        '<form method="post" action="' + urls.toggle + '" class="js-ajax" data-ajax="channel-toggle">' +
        '<button type="submit" class="status-pill ' + (on ? "on" : "off") + '"><span class="dot"></span> ' +
        (on ? "Выкл" : "Вкл") + "</button></form>" +
        '<form method="post" action="' + urls.del + '" class="js-ajax" data-ajax="channel-delete" data-confirm="Удалить канал?">' +
        '<button type="submit" class="danger">удалить</button></form>' +
        "</td></tr>"
      );
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    window.applyFormFields = function (form, fields) {
      if (!form || !fields) return;
      Object.keys(fields).forEach(function (name) {
        const el = form.elements.namedItem(name);
        if (el instanceof RadioNodeList) {
          const want = fields[name] == null ? "" : String(fields[name]);
          Array.prototype.forEach.call(el, function (r) {
            r.checked = r.value === want;
          });
          return;
        }
        if (!el) return;
        applyControl(el, fields[name]);
      });
    };

    function applyControl(el, val) {
      if (el.type === "checkbox") {
        el.checked = !!val;
        return;
      }
      if (el.type === "radio") {
        el.checked = el.value === (val == null ? "" : String(val));
        return;
      }
      el.value = val == null ? "" : String(val);
    }

    window.heroTagHtml = function (hero) {
      if (!hero) return "";
      const parts = [];
      if (hero.is_test) parts.push('<span class="tag warn">🧪 test</span>');
      if (hero.is_blocked) parts.push('<span class="tag danger">🚫 ban</span>');
      if (hero.is_suspicious) parts.push('<span class="tag warn">⚠️ suspicious</span>');
      if (hero.is_active) parts.push('<span class="tag ok">✅ active</span>');
      else parts.push('<span class="tag">🙈 скрыт</span>');
      if (hero.is_complete) parts.push('<span class="tag ok">📋 ready</span>');
      else parts.push('<span class="tag">📝 draft</span>');
      if (hero.has_premium) parts.push('<span class="tag premium">⭐ premium</span>');
      if (hero.gender === "male") parts.push('<span class="tag male">♂ м</span>');
      if (hero.gender === "female") parts.push('<span class="tag female">♀ ж</span>');
      return parts.join(" ");
    };

    function applyHero(hero) {
      if (!hero) return;
      const nameEl = document.querySelector("[data-hero-name]");
      if (nameEl) {
        let html = escapeHtml(hero.name || "Без имени");
        if (hero.age != null) {
          html += '<span class="meta"> · ' + escapeHtml(String(hero.age)) + "</span>";
        }
        nameEl.innerHTML = html;
      }
      const userMeta = document.querySelector("[data-hero-user]");
      if (userMeta) {
        let html = hero.username
          ? "@" + escapeHtml(hero.username)
          : "без @username";
        if (userMeta.getAttribute("data-is-admin") === "1") html += " · admin";
        userMeta.innerHTML = html;
      }
      const tags = document.querySelector("[data-hero-tags]");
      if (tags) tags.innerHTML = window.heroTagHtml(hero);
      // If ban forced is_active off, sync profile checkbox outside the user form.
      if (hero.is_blocked) {
        const active = document.querySelector('#profile input[name="is_active"]');
        if (active) active.checked = !!hero.is_active;
      }
    }

    function applyLikes(likes) {
      if (!likes) return;
      const sent = document.querySelector("[data-likes-sent]");
      const received = document.querySelector("[data-likes-received]");
      const daily = document.querySelector("[data-likes-daily]");
      if (sent) sent.textContent = String(likes.sent);
      if (received) received.textContent = String(likes.received);
      if (daily) daily.textContent = String(likes.daily_used);
    }

    document.addEventListener("submit", async function (e) {
      const form = e.target.closest("form.js-ajax");
      if (!form) return;
      e.preventDefault();
      if (form.dataset.confirm && !window.confirm(form.dataset.confirm)) return;

      const kind = form.dataset.ajax || "generic";
      const btn = form.querySelector('button[type="submit"], button:not([type])');
      if (btn) btn.disabled = true;

      try {
        const data = await window.ajaxSubmit(form);

        if (kind === "soft-launch") {
          const on = !!data.on;
          const pill = form.querySelector(".status-pill");
          window.setPill(pill, on, "ON", "OFF");
          const hidden = form.querySelector('input[name="registration_only"]');
          if (hidden) hidden.value = on ? "0" : "1";
        } else if (kind === "test-visibility") {
          const on = !!data.visible;
          const pill = form.querySelector(".status-pill");
          window.setPill(pill, on, "ON", "OFF");
          const hidden = form.querySelector('input[name="visible"]');
          if (hidden) hidden.value = on ? "0" : "1";
          if (typeof data.count === "number") updateTestCount(data.count);
        } else if (kind === "test-create" || kind === "test-clear") {
          if (typeof data.count === "number") updateTestCount(data.count);
        } else if (kind === "channel-toggle") {
          const row = form.closest("tr");
          const active = !!data.active;
          const pill = form.querySelector(".status-pill");
          window.setPill(pill, active, "Выкл", "Вкл");
          const badge = row && row.querySelector(".status-badge");
          if (badge) {
            badge.classList.toggle("on", active);
            badge.classList.toggle("off", !active);
            badge.innerHTML = '<span class="dot"></span> ' + (active ? "ON" : "OFF");
          }
        } else if (kind === "channel-delete" || kind === "order" || kind === "unban" || kind === "clear-suspicious" || kind === "ban") {
          const row = form.closest("tr, article.blocked-card");
          if (row) row.remove();
        } else if (kind === "channel-add" && data.channel) {
          const table = document.querySelector("#channels table");
          if (table) table.insertAdjacentHTML("beforeend", channelRowHtml(data.channel));
          form.reset();
        } else if (kind === "premium-save") {
          const status = document.querySelector("[data-premium-status]");
          const untilField = data.premium_until || "";
          const untilLabel = data.premium_until_label || untilField.replace("T", " ");
          if (status) {
            if (data.premium_active && untilLabel) {
              status.innerHTML =
                '<strong class="flash-ok">работает до ' +
                escapeHtml(untilLabel) +
                " UTC</strong>";
            } else if (untilLabel) {
              status.innerHTML =
                '<span class="meta">не активен (дата ' +
                escapeHtml(untilLabel) +
                " UTC уже прошла)</span>";
            } else {
              status.innerHTML = '<span class="meta">нет</span>';
            }
          }
          const dateForm = document.querySelector("#premium form.js-confirm-changes");
          const dateFields = { premium_until: untilField };
          if (dateForm) window.applyFormFields(dateForm, dateFields);
          else window.applyFormFields(form, data.fields || dateFields);
          if (dateForm && typeof dateForm._ajaxAfter === "function" && dateForm !== form) {
            dateForm._ajaxAfter({ fields: dateFields });
          }
          applyHero(data.hero);
        } else if (kind === "account-user" || kind === "account-profile" || kind === "settings") {
          window.applyFormFields(form, data.fields);
          if (kind === "account-user" && data.profile_fields) {
            const profileForm = document.querySelector("#profile form.js-ajax");
            if (profileForm) window.applyFormFields(profileForm, data.profile_fields);
          }
          applyHero(data.hero);
        } else if (kind === "likes-clear") {
          applyLikes(data.likes);
        }

        if (typeof form._ajaxAfter === "function") form._ajaxAfter(data);
        window.showToast(data.message || "Готово.", true);
      } catch (err) {
        if (err && err.message !== "auth") {
          window.showToast(err.message || "Ошибка", false);
        }
      } finally {
        if (btn) btn.disabled = false;
      }
    });
  })();
  </script>
</body>
</html>
