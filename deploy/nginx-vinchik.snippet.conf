# Фрагмент внутрь server { listen 443 } (krigz.com или nginxNNNN.hostkey.in).
#
# Как подключить:
#   cp deploy/nginx-vinchik.snippet.conf /etc/nginx/snippets/vinchik.conf
#   в нужный server:  include /etc/nginx/snippets/vinchik.conf;
#   nginx -t && systemctl reload nginx
# Или: bash deploy/enable-nginx-vinchik.sh
#
# URI до контейнера должен совпадать с WEBHOOK_PATH в .env.
# Бот слушает /vinchik/webhook — НЕ переписывай путь на /webhook/bot.
# proxy_pass БЕЗ URI — nginx передаёт /vinchik/webhook как есть.
#
# Админка: https://<host>/vinchik  (без слэша редиректит на /vinchik/)
# Hostkey: `return 200` на уровне server перебивает location — держи заглушку
# только в `location = /`, иначе /vinchik никогда не дойдёт до proxy.

    location = /vinchik {
        return 301 /vinchik/;
    }

    location = /vinchik/webhook {
        proxy_pass http://127.0.0.1:8181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /vinchik/ {
        proxy_pass http://127.0.0.1:8180/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }
