# Фрагмент для /etc/nginx/sites-available/krigz.com (внутри server listen 443)
#
# ВАЖНО: URI до контейнера должен совпадать с WEBHOOK_PATH в .env.
# Сейчас бот слушает /vinchik/webhook — НЕ переписывай путь на /webhook/bot.

    # Vinchik webhook → host:8181 → container:8081
    # proxy_pass БЕЗ URI — nginx передаёт /vinchik/webhook как есть
    location = /vinchik/webhook {
        proxy_pass http://127.0.0.1:8181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vinchik админка → host:8180 → container:8080
    location /vinchik/ {
        proxy_pass http://127.0.0.1:8180/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
