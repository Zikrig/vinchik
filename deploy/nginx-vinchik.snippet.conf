# Фрагмент для /etc/nginx/sites-available/krigz.com (внутри server listen 443)

    # Vinchik webhook → контейнер bot (хост 8181 → контейнер 8081)
    location /vinchik/webhook {
        proxy_pass http://127.0.0.1:8181;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vinchik админка → контейнер web (хост 8180 → контейнер 8080)
    # слэш в конце proxy_pass срезает /vinchik для приложения
    location /vinchik/ {
        proxy_pass http://127.0.0.1:8180/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
